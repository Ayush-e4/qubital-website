name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Single source of truth for the Node version — see .nvmrc
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The pre-commit hook formats staged files, but a hook can be skipped
      # (--no-verify, or a commit made outside the repo). This is the backstop.
      - name: Check formatting
        run: npm run format:check

      # Type-checks the locale dictionaries against the English one, so a
      # missing translation is a build error rather than a blank string.
      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Browser-free smoke suite (tests/smoke.test.mjs): locale routing,
      # canonical/hreflang, titles and the sitemap. No browser, a couple of
      # seconds. Interactive checks live in tests/browser/ and are run locally.
      - name: Smoke tests
        run: npm test
